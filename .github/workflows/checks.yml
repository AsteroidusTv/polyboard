name: Dashboard checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: for file in *.js; do node --check "$file" || exit; done
      - run: npm ci --prefix trading --ignore-scripts
      - run: node --test trading/test-client.js
      - run: npm run --prefix trading build && git diff --exit-code -- order-ticket.js
